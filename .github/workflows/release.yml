name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-archives:
    name: Backend archive linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        if: matrix.goarch == 'amd64'
        working-directory: backend
        run: |
          go mod verify
          go test -mod=readonly ./...
          go vet ./...
      - name: Build release archive
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          package="janus-backend-${GITHUB_REF_NAME}-linux-${GOARCH}"
          stage="${RUNNER_TEMP}/${package}"
          mkdir -p "${stage}"
          (
            cd backend
            go build -mod=readonly -trimpath -ldflags="-s -w" -o "${stage}/janus" ./cmd/janus/
          )
          cp .env.example DEPLOYMENT.md LICENSE "${stage}/"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/${package}.tar.gz" "${package}"
          test -s "${RUNNER_TEMP}/${package}.tar.gz"
      - name: Upload backend archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-backend-${{ matrix.goarch }}
          path: ${{ runner.temp }}/janus-backend-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  frontend-archive:
    name: Frontend static archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and package frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
          package="janus-frontend-${GITHUB_REF_NAME}"
          stage="${RUNNER_TEMP}/${package}"
          mkdir -p "${stage}"
          cp -R dist "${stage}/dist"
          cp nginx.conf "${stage}/nginx.conf.template"
          cp ../DEPLOYMENT.md ../LICENSE "${stage}/"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/${package}.tar.gz" "${package}"
          test -s "${RUNNER_TEMP}/${package}.tar.gz"
      - name: Upload frontend archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-frontend
          path: ${{ runner.temp }}/janus-frontend-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs:
      - backend-archives
      - frontend-archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/*.tar.gz release/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.tar.gz release/SHA256SUMS --verify-tag --generate-notes --title "Janus ${GITHUB_REF_NAME}"
          fi

  container-images:
    name: Publish ${{ matrix.component }} image
    needs:
      - backend-archives
      - frontend-archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compute lowercase image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}"
          echo "name=${image}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: mode=max
          sbom: true
