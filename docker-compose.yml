services:
  janus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
      - API_PORT=8080
      - ENV_PATH=/dev/null
      - REDIS_ADDR=redis:6379
    volumes:
      - ./data:/data
      - ./certs:/certs
    ports:
      - "8080:8080"
      - "10000-10100:10000-10100"
      - "3007:3007"
      - "5555:5555"
      - "5001:5001"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
      else
        exec redis-server --bind 0.0.0.0 --save "" --appendonly no
      fi'
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_BACKEND=janus
    ports:
      - "3000:3000"
    depends_on:
      - janus
    restart: unless-stopped
