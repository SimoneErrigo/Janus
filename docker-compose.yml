services:
  janus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
      - API_PORT=8080
      - ENV_PATH=/dev/null
      - REDIS_ADDR=redis:6379
    volumes:
      - ./data:/data
      - ./certs:/certs
    ports:
      - "127.0.0.1:8080:8080"
      - "3000-3001:3000-3001"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
      else
        exec redis-server --bind 0.0.0.0 --save "" --appendonly no
      fi'
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_BACKEND=janus
      - FRONTEND_BIND=0.0.0.0
    ports:
      - "127.0.0.1:2999:3000"
    depends_on:
      - janus
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    environment:
      DOZZLE_HOSTNAME: janus-logs
      DOZZLE_NO_ANALYTICS: "true"
    restart: unless-stopped
