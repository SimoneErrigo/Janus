services:
  janus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
      - API_PORT=8080
      - ENV_PATH=/dev/null
    volumes:
      - ./data:/data
      - ./certs:/certs
    ports:
      - "8080:8080"
      - "10000-10100:10000-10100"
      - "3007:3007"
      - "5555:5555"
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_BACKEND=janus
    ports:
      - "3000:3000"
    depends_on:
      - janus
    restart: unless-stopped
