services:
  janus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
      - API_PORT=8080
      - ENV_PATH=/dev/null
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    network_mode: host
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - janus
    restart: unless-stopped
