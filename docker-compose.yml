services:
  janus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
      - API_PORT=9090
      - ENV_PATH=/dev/null
      - DATA_BIND_MODE=wildcard
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./protos:/protos
    ports:
      - "3000-3001:3000-3001"
      - "5555:5555"
      - "3333:3333"
      - "5060:5060"
      - "80:80"
      - "6006:6006"
      - "1337:1337"
      - "8081:8081"
    restart: unless-stopped

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --bind 0.0.0.0 --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
      else
        exec redis-server --bind 0.0.0.0 --save "" --appendonly no
      fi'
    env_file: .env
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_BACKEND=janus
      - FRONTEND_BIND=0.0.0.0
      - FRONTEND_PORT=3000
    ports:
      - "0.0.0.0:2999:3000"
    depends_on:
      - janus
    restart: unless-stopped
