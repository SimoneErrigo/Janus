server {
    listen ${FRONTEND_BIND}:${FRONTEND_PORT};
    root /usr/share/nginx/html;
    index index.html;

    # SSE stream
    location /api/packets/stream {
        proxy_pass http://${API_BACKEND}:9090;
        # Preserve the browser-facing port so the backend can enforce an exact
        # credentialed CORS origin instead of trusting every port on the host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # API requests proxied to backend
    location /api/ {
        proxy_pass http://${API_BACKEND}:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
