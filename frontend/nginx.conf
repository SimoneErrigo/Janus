map $http_x_forwarded_proto $janus_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen ${FRONTEND_BIND}:${FRONTEND_PORT};
    root ${FRONTEND_ROOT};
    index index.html;

    # The backend accepts PCAP uploads up to 256 MiB. Leave a small allowance
    # for multipart framing instead of nginx's 1 MiB default.
    client_max_body_size 257m;

    # SSE stream
    location /api/packets/stream {
        proxy_pass http://${API_BACKEND}:${API_BACKEND_PORT};
        # Preserve the browser-facing port so the backend can enforce an exact
        # credentialed CORS origin instead of trusting every port on the host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $janus_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # API requests proxied to backend
    location /api/ {
        proxy_pass http://${API_BACKEND}:${API_BACKEND_PORT};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $janus_forwarded_proto;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
